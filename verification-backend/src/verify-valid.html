<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Certificate Verified &ndash; {{ORG_NAME}}</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#f0fdf4 0%,#dcfce7 100%);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem}
  .card{background:#fff;border-radius:20px;box-shadow:0 4px 6px -1px rgba(0,0,0,.07),0 20px 40px -10px rgba(0,0,0,.12);width:100%;max-width:480px;overflow:hidden}
  .card-header{background:linear-gradient(135deg,#16a34a 0%,#15803d 100%);padding:2.5rem 2rem 2rem;text-align:center}
  .icon-ring{width:72px;height:72px;background:rgba(255,255,255,.2);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem;border:3px solid rgba(255,255,255,.4)}
  .card-header h1{color:#fff;font-size:1.4rem;font-weight:700;margin-bottom:.35rem}
  .card-header p{color:rgba(255,255,255,.8);font-size:.875rem}
  .card-body{padding:1.75rem 2rem}
  .detail-row{display:flex;align-items:flex-start;padding:.85rem 0;border-bottom:1px solid #f3f4f6}
  .detail-row:last-of-type{border-bottom:none}
  .detail-label{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#6b7280;min-width:110px;padding-top:2px;flex-shrink:0}
  .detail-value{font-size:.95rem;color:#111827;font-weight:500;flex:1}
  .detail-value.mono{font-family:'Courier New',monospace;font-size:.78rem;color:#6b7280;word-break:break-all;font-weight:400}
  .card-footer{background:#f9fafb;border-top:1px solid #f3f4f6;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;font-size:.78rem;color:#9ca3af;flex-wrap:wrap;gap:.5rem}
  .org-badge{font-weight:600;color:#374151}
  @media(max-width:520px){.card-body{padding:1.25rem}.detail-label{min-width:90px}}
</style>
</head>
<body>
<div class="card">
  <div class="card-header">
    <div class="icon-ring">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
    <h1>Verified Authentic</h1>
    <p>This certificate is genuine and has not been altered.</p>
  </div>
  <div class="card-body">
    <div class="detail-row">
      <div class="detail-label">Issued To</div>
      <div class="detail-value">{{NAME}}</div>
    </div>
    <div class="detail-row">
      <div class="detail-label">Event</div>
      <div class="detail-value">{{EVENT}}</div>
    </div>
    <div class="detail-row">
      <div class="detail-label">Issue Date</div>
      <div class="detail-value">{{DATE}}</div>
    </div>
    <div class="detail-row">
      <div class="detail-label">Certificate ID</div>
      <div class="detail-value mono">{{ID}}</div>
    </div>
  </div>
  <div class="card-footer">
    <span>Issued by <span class="org-badge">{{ORG_NAME}}</span></span>
    <span>Verified {{VERIFIED_ON}}</span>
  </div>
</div>
</body>
</html>
